# DKMS config for roadrunner2/macbook12-spi-driver (branch touchbar-driver-hid-driver).
# applespi is in mainline since 5.3, so only the iBridge / Touch Bar / ALS modules are built.
PACKAGE_NAME="macbook12-spi-driver"
PACKAGE_VERSION="0.1"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build obj-m='apple-ibridge.o apple-ib-tb.o apple-ib-als.o' modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="apple-ibridge"
BUILT_MODULE_NAME[1]="apple-ib-tb"
BUILT_MODULE_NAME[2]="apple-ib-als"
DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
DEST_MODULE_LOCATION[2]="/updates/dkms"
# Upstream stopped at ~5.x; this ports it to newer kernel APIs (guarded, still builds on old ones).
PATCH[0]="0001-kernel-6.17.patch"
AUTOINSTALL="yes"
